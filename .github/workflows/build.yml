name: Build PS-Launcher.exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Clave de SteamGridDB para las portadas automáticas: sale del secreto SGDB_KEY del repositorio (no está en el código).
      # Sin el secreto (o compilando en local) se escribe vacía y el launcher usa solo Steam y la clave de Ajustes.
      - name: Clave de SteamGridDB
        shell: bash
        env:
          SGDB_KEY: ${{ secrets.SGDB_KEY }}
        run: |
          node -e "require('fs').writeFileSync('build-key.json', JSON.stringify({ sgdb: process.env.SGDB_KEY || '' }))"
          node -e "console.log('clave incluida:', require('./build-key.json').sgdb ? 'sí' : 'no')"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PS-Launcher
          path: dist/PS-Launcher.exe
      # Publica (o actualiza) la release v<version de package.json>: el launcher la detecta y ofrece actualizar
      - name: Leer versión
        id: ver
        shell: bash
        # Fuera de GitHub (compilación local) no existe GITHUB_OUTPUT: solo se muestra la versión
        run: |
          v=$(node -p "require('./package.json').version")
          echo "Versión: $v"
          if [ -n "$GITHUB_OUTPUT" ]; then echo "v=$v" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: PS Launcher ${{ steps.ver.outputs.v }}
          files: dist/PS-Launcher.exe
